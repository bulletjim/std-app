name: STD-App CI/CD Pipeline
on:
  push:
    branches: [ "main" ] 
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci-pipeline:
    name: Code Check & Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Code Checkout 
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Execute Tests
        run: npm test
        
      - name: Compile Test
        run: npm run package


  # ==========================================
  # 2. CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  cd-pipeline:
    name: Build & Release (${{ matrix.os }})
    needs: ci-pipeline 
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installa System Dependecies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm fakeroot dpkg

      - name: Installa NPM Dependencies
        run: npm ci

      - name: Compile & Publish On Github Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-forge publish
