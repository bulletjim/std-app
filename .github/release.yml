changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]

  categories:
    - title: "New Features"
      labels:
        - "enhancement"
        - "feature"

    - title: "Bug Fixes"
      labels:
        - "bug"
        - "fix"

    - title: "Documentation"
      labels:
        - "documentation"

    - title: "Maintenance & Refactoring"
      labels:
        - "chore"
        - "refactor"

    - title: "Other"
      labels:
        - "*"
