<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta lang="en"/>
    <title>STD</title>

  </head>
  <body>
    <script type="module" src="src/renderer.ts"></script>
    <header class="header-container">
      <div class="menu-container">
        <div class="logo-container">
          <img id="logo" src="/src/images/Logo.png" alt="logo">
        </div>
        <div class="create-button-container">
          <button id="create-table-button" command="show-modal" commandfor="create-table-dialog">Create Table</button>
          <dialog id="create-table-dialog">
            <form method="dialog" id="create-table-form">
              <label>
              Name:
              <input id="input-table-name" name="name" type="text">
            </label>
            <label>
              Password:
              <input id="input-table-password" name="password" type="password">
            </label>
            <button id="input-table-submit" type="submit">Submit</button>
            </form>
            <button id="close-create-table-dialog-button" commandfor="create-table-dialog" command="close">Close</button>
          </dialog>
        </div>
      </div>
      
    </header>
  </body>
</html>
